<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: #090d16;
            color: #cbd5e1;
            line-height: 1.8;
            padding: 40px 20px 80px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            color: #fff;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 800;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
        }
        h2 {
            font-family: 'Outfit', sans-serif;
            color: #38bdf8;
            font-size: 18px;
            margin: 24px 0 8px;
            font-weight: 700;
        }
        p { margin-bottom: 16px; font-size: 14.5px; }
        ul { padding-left: 20px; margin-bottom: 16px; font-size: 14.5px; }
        li { margin-bottom: 6px; }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: #38bdf8;
            color: #090d16;
        }
    </style>
    <title>404 — Page Not Found | Bengal Explorers</title>
    <meta name="description" content="Page not found - Bengal Explorers travel and transit portal.">
    <meta name="robots" content="noindex, follow">
</head>
<body style="display: flex; align-items: center; justify-content: center; text-align: center;">
    <div class="container">
        <div style="font-size: 64px; margin-bottom: 8px;">🧭</div>
        <h1>404 — Route Not Found</h1>
        <div class="subtitle">Looks like you took an uncharted trail</div>
        <p>The page or destination you are searching for does not exist or has been relocated to another travel route.</p>
        <a href="index.html" class="back-link">← Back to Safety (Main Portal)</a>
    </div>
</body>
</html>
